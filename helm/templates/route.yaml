apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "handover-ifx.fullname" . }}
  namespace: {{ .Values.namespace }}
spec:
  host: {{ .Values.route.host }}
  to:
    kind: Service
    name: {{ include "handover-ifx.fullname" . }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
